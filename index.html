<style>
  :root{
    --black: #0d0c0a;
    --charcoal: #1c1a17;
    --charcoal-light: #262320;
    --ivory: #f3efe6;
    --silver: #c9cbcd;
    --silver-dim: #8f9194;
    --gold: #b08d4f;
    --gold-bright: #cba867;
    --line: rgba(243,239,230,0.12);
    --radius: 2px;
    --serif: 'Cormorant Garamond', serif;
    --sans: 'Manrope', sans-serif;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--black);
    color:var(--ivory);
    font-family:var(--sans);
    font-size:16px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%;display:block;}
  a{color:inherit;text-decoration:none;}
  h1,h2,h3,h4{font-family:var(--serif);font-weight:500;margin:0;color:var(--ivory);}
  p{margin:0;}
  .wrap{max-width:1180px;width:100%;margin:0 auto;padding:0 28px;}
  ::selection{background:var(--gold);color:var(--black);}
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
    outline:2px solid var(--gold-bright);
    outline-offset:3px;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; scroll-behavior:auto !important;}
  }

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:16px 32px;
    font-family:var(--sans);
    font-size:13px;
    font-weight:700;
    letter-spacing:0.14em;
    text-transform:uppercase;
    border:1px solid transparent;
    border-radius:var(--radius);
    cursor:pointer;
    transition:background .25s ease, color .25s ease, border-color .25s ease;
    white-space:nowrap;
  }
  .btn-gold{background:var(--gold); color:var(--black);}
  .btn-gold:hover{background:var(--gold-bright);}
  .btn-outline{background:transparent; color:var(--ivory); border-color:rgba(243,239,230,0.35);}
  .btn-outline:hover{border-color:var(--gold-bright); color:var(--gold-bright);}
  .btn-line{background:transparent;color:var(--gold-bright);border-color:var(--gold);}
  .btn-line:hover{background:var(--gold);color:var(--black);}

  /* ---------- Nav ---------- */
  header{
    position:sticky; top:0; z-index:100;
    background:rgba(13,12,10,0.86);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .navbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 28px;
    max-width:1180px; margin:0 auto;
  }
  .logo{
    font-family:var(--serif);
    font-size:26px;
    letter-spacing:0.04em;
    display:flex; align-items:baseline; gap:8px;
  }
  .logo .kd{color:var(--gold-bright); font-weight:600;}
  .logo .cars{font-size:12px; letter-spacing:0.32em; color:var(--silver-dim); font-family:var(--sans); text-transform:uppercase; font-weight:600; position:relative; top:-2px;}
  nav.menu{display:flex; gap:36px;}
  nav.menu a{font-size:14px; color:var(--silver); transition:color .2s ease; position:relative;}
  nav.menu a:hover{color:var(--ivory);}
  .nav-right{display:flex; align-items:center; gap:18px;}
  .social-chip{display:flex; align-items:center; justify-content:center; width:36px; height:36px; border:1px solid var(--line); border-radius:50%; transition:border-color .2s ease, color .2s ease; color:var(--silver);}
  .social-chip:hover{border-color:var(--gold-bright); color:var(--gold-bright);}
  .social-chip svg{width:17px;height:17px;}
  .call-chip{display:flex; align-items:center; gap:8px; font-size:14px; color:var(--silver);}
  .call-chip svg{width:15px;height:15px;stroke:var(--gold-bright);}
  .hamburger{display:none; background:none; border:none; color:var(--ivory); cursor:pointer; padding:8px;}
  .mobile-menu{display:none; flex-direction:column; gap:0; border-top:1px solid var(--line); background:var(--charcoal);}
  .mobile-menu a{padding:16px 28px; border-bottom:1px solid var(--line); font-size:15px; color:var(--silver);}
  .mobile-menu.open{display:flex;}
  .mobile-call-bar{display:none;}

  @media (max-width:920px){
    nav.menu, .call-chip{display:none;}
    .hamburger{display:block;}
    .nav-right .btn{display:none;}
  }

  /* ---------- Hero ---------- */
  .hero{
    position:relative;
    min-height:92vh;
    display:flex;
    align-items:flex-end;
    overflow:hidden;
  }
  .hero img{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    filter:saturate(1.02);
  }
  .hero::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(13,12,10,0.15) 0%, rgba(13,12,10,0.25) 40%, rgba(13,12,10,0.92) 92%),
               linear-gradient(90deg, rgba(13,12,10,0.75) 0%, rgba(13,12,10,0.1) 55%);
  }
  .hero-content{
    position:relative; z-index:2;
    width:100%;
    padding:0 28px 72px;
    max-width:1180px; margin:0 auto;
  }
  .hero-eyebrow{
    font-size:14px; color:var(--silver); letter-spacing:0.02em; margin-bottom:18px;
    max-width:480px;
  }
  .hero-eyebrow .dot{color:var(--gold-bright); margin:0 6px;}
  .hero h1{
    font-size:clamp(40px, 6vw, 76px);
    line-height:1.04;
    max-width:780px;
    color:var(--ivory);
    font-weight:500;
  }
  .hero-sub{
    margin-top:22px;
    font-size:18px;
    color:var(--silver);
    max-width:480px;
    line-height:1.6;
  }
  .hero-ctas{display:flex; gap:16px; margin-top:36px; flex-wrap:wrap;}
  .hero-prices{
    display:flex; gap:28px; margin-top:48px; flex-wrap:wrap;
    padding-top:28px; border-top:1px solid var(--line);
    max-width:620px;
  }
  .price-item{display:flex; flex-direction:column; gap:4px;}
  .price-item .model{font-family:var(--serif); font-size:20px; color:var(--ivory);}
  .price-item .amount{font-size:13px; color:var(--gold-bright); letter-spacing:0.06em;}

  @media (max-width:640px){
    .hero{min-height:100vh;}
    .hero-content{padding-bottom:calc(48px + 66px);}
    .hero-ctas{flex-direction:column; align-items:stretch;}
    .hero-ctas .btn{width:100%;}
  }

  /* ---------- Section shell ---------- */
  section{padding:110px 0;}
  .section-head{max-width:640px; margin-bottom:56px;}
  .section-label{font-size:13px; color:var(--gold-bright); letter-spacing:0.08em; margin-bottom:14px; font-weight:600;}
  .section-head h2{font-size:clamp(30px,4vw,44px); line-height:1.1;}
  .section-head p{margin-top:18px; color:var(--silver); font-size:17px; line-height:1.7;}

  .divider{height:1px; background:var(--line); border:none; margin:0;}

  /* ---------- Booking form ---------- */
  .booking{
    background:var(--charcoal);
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
  }
  .booking-inner{
    display:grid;
    grid-template-columns:1fr 1.4fr;
    gap:64px;
    align-items:start;
  }
  .booking-intro h2{font-size:clamp(28px,3.4vw,38px); line-height:1.12;}
  .booking-intro p{margin-top:16px; color:var(--silver); font-size:16px; line-height:1.7;}
  .booking-call{
    margin-top:32px;
    display:flex; align-items:center; gap:12px;
    padding:18px 20px;
    border:1px solid var(--line);
    background:var(--charcoal-light);
    flex-wrap:wrap;
  }
  .booking-call svg{width:20px;height:20px;stroke:var(--gold-bright); flex-shrink:0;}
  .booking-call a{font-family:var(--serif); font-size:20px; color:var(--ivory);}
  .booking-call span{display:block; font-size:12px; color:var(--silver-dim); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:2px;}

  form.quote-form{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
    background:var(--charcoal-light);
    border:1px solid var(--line);
    padding:36px;
  }
  .field{display:flex; flex-direction:column; gap:8px;}
  .field.full{grid-column:1 / -1;}
  .field label{font-size:12px; text-transform:uppercase; letter-spacing:0.08em; color:var(--silver-dim);}
  .field input, .field select, .field textarea{
    background:var(--black);
    border:1px solid var(--line);
    color:var(--ivory);
    font-family:var(--sans);
    font-size:15px;
    padding:13px 14px;
    border-radius:var(--radius);
    width:100%;
  }
  .field input::placeholder, .field textarea::placeholder{color:#5c5a55;}
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--gold);}
  .field textarea{resize:vertical; min-height:80px;}
  .quote-form .submit-row{grid-column:1 / -1; display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-top:6px;}
  .form-note{font-size:13px; color:var(--silver-dim);}
  .confirm-msg{
    grid-column:1/-1;
    display:none;
    padding:18px 20px;
    border:1px solid var(--gold);
    background:rgba(176,141,79,0.1);
    color:var(--ivory);
    font-size:14px;
  }
  .confirm-msg.show{display:block;}

  @media (max-width:900px){
    .booking-inner{grid-template-columns:1fr; gap:40px;}
    form.quote-form{grid-template-columns:1fr; padding:26px;}
  }

  /* ---------- Feature cards ---------- */
  .features-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
  }
  .feature-card{
    background:var(--black);
    padding:40px 32px;
  }
  .feature-card .num{font-family:var(--serif); font-size:15px; color:var(--gold-bright); margin-bottom:20px; display:block;}
  .feature-card h3{font-size:22px; margin-bottom:12px; font-weight:500;}
  .feature-card p{color:var(--silver); font-size:15px; line-height:1.65;}
  @media (max-width:900px){
    .features-grid{grid-template-columns:repeat(2, 1fr);}
  }
  @media (max-width:560px){
    .features-grid{grid-template-columns:1fr;}
  }

  /* ---------- Fleet ---------- */
  .fleet-list{display:flex; flex-direction:column; gap:1px; background:var(--line); border:1px solid var(--line);}
  .fleet-card{
    display:grid;
    grid-template-columns:1.15fr 1fr;
  }
  .fleet-card:nth-child(even){grid-template-columns:1fr 1.15fr;}
  .fleet-card:nth-child(even) .fleet-media{order:2;}
  .fleet-media{position:relative; overflow:hidden; min-height:340px;}
  .fleet-media img{width:100%; height:100%; object-fit:cover; transition:transform .6s ease;}
  .fleet-card:hover .fleet-media img{transform:scale(1.04);}
  .fleet-body{
    background:var(--charcoal);
    padding:56px;
    display:flex; flex-direction:column; justify-content:center;
  }
  .fleet-body .tag{font-size:12px; color:var(--gold-bright); letter-spacing:0.1em; text-transform:uppercase; margin-bottom:14px;}
  .fleet-body h3{font-size:clamp(26px,3vw,34px); margin-bottom:6px;}
  .fleet-price{font-size:15px; color:var(--silver-dim); margin-bottom:20px;}
  .fleet-price strong{color:var(--gold-bright); font-family:var(--serif); font-size:19px;}
  .fleet-body p.desc{color:var(--silver); font-size:15.5px; line-height:1.75; margin-bottom:28px;}
  @media (max-width:820px){
    .fleet-card, .fleet-card:nth-child(even){grid-template-columns:1fr;}
    .fleet-card:nth-child(even) .fleet-media{order:0;}
    .fleet-media{min-height:260px;}
    .fleet-body{padding:34px 28px;}
  }

  /* ---------- Services ---------- */
  .services-list{border-top:1px solid var(--line);}
  .service-row{
    display:grid;
    grid-template-columns:220px 1fr;
    gap:40px;
    padding:34px 0;
    border-bottom:1px solid var(--line);
    align-items:start;
  }
  .service-row h3{font-size:22px; font-weight:500;}
  .service-row p{color:var(--silver); font-size:15.5px; line-height:1.7; max-width:640px;}
  @media (max-width:780px){
    .service-row{grid-template-columns:1fr; gap:10px;}
  }

  /* ---------- Derby section ---------- */
  .derby{
    position:relative;
    min-height:560px;
    display:flex;
    align-items:center;
  }
  .derby img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  .derby::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(90deg, rgba(13,12,10,0.94) 0%, rgba(13,12,10,0.78) 45%, rgba(13,12,10,0.35) 100%);
  }
  .derby-content{position:relative; z-index:2; max-width:560px;}
  .derby-content .section-label{color:var(--gold-bright);}
  .derby-content h2{font-size:clamp(28px,4vw,42px); line-height:1.15; margin-bottom:20px;}
  .derby-content p{color:var(--silver); font-size:16.5px; line-height:1.75; margin-bottom:14px;}

  /* ---------- How it works ---------- */
  .steps{display:grid; grid-template-columns:repeat(3,1fr); gap:48px;}
  .step .step-num{font-family:var(--serif); font-size:56px; color:var(--gold); line-height:1; margin-bottom:18px; opacity:0.85;}
  .step h3{font-size:21px; margin-bottom:10px;}
  .step p{color:var(--silver); font-size:15px; line-height:1.65;}
  @media (max-width:800px){ .steps{grid-template-columns:1fr; gap:36px;} }

  /* ---------- CTA band ---------- */
  .cta-band{
    background:linear-gradient(180deg, var(--charcoal) 0%, var(--black) 100%);
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    text-align:center;
    padding:120px 28px;
  }
  .cta-band h2{font-size:clamp(32px,5vw,52px); max-width:760px; margin:0 auto; line-height:1.12;}
  .cta-band p{margin-top:20px; color:var(--silver); font-size:17px;}
  .cta-buttons{display:flex; gap:16px; justify-content:center; margin-top:40px; flex-wrap:wrap;}

  /* ---------- FAQ ---------- */
  .faq-item{border-bottom:1px solid var(--line);}
  .faq-q{
    width:100%; text-align:left; background:none; border:none; color:var(--ivory);
    display:flex; align-items:center; justify-content:space-between;
    padding:26px 0; cursor:pointer; font-family:var(--serif); font-size:20px;
    gap:20px;
  }
  .faq-q .plus{font-family:var(--sans); font-size:22px; color:var(--gold-bright); transition:transform .25s ease; flex-shrink:0;}
  .faq-item.open .faq-q .plus{transform:rotate(45deg);}
  .faq-a{max-height:0; overflow:hidden; transition:max-height .3s ease;}
  .faq-a p{padding-bottom:26px; color:var(--silver); font-size:15.5px; line-height:1.7; max-width:680px;}
  .faq-item.open .faq-a{max-height:200px;}

  /* ---------- Footer ---------- */
  footer{background:var(--charcoal); border-top:1px solid var(--line); padding:64px 0 28px;}
  .footer-grid{display:grid; grid-template-columns:1.4fr 1fr 1fr; gap:48px; padding-bottom:44px;}
  .footer-brand .logo{margin-bottom:14px;}
  .footer-brand p{color:var(--silver-dim); font-size:14px; line-height:1.7; max-width:280px;}
  .footer-col h4{font-size:13px; text-transform:uppercase; letter-spacing:0.08em; color:var(--silver-dim); margin-bottom:18px; font-family:var(--sans); font-weight:600;}
  .footer-col a{display:block; font-size:14.5px; color:var(--silver); margin-bottom:12px; transition:color .2s ease;}
  .footer-col a:hover{color:var(--gold-bright);}
  .footer-bottom{border-top:1px solid var(--line); padding-top:24px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px; font-size:13px; color:var(--silver-dim);}
  @media (max-width:760px){ .footer-grid{grid-template-columns:1fr; gap:32px;} }

  /* ---------- Sticky mobile call bar ---------- */
  .mobile-call-fixed{
    display:none;
    position:fixed; bottom:0; left:0; right:0; z-index:200;
    background:var(--black);
    border-top:1px solid var(--line);
    padding:12px 16px;
    gap:10px;
  }
  @media (max-width:640px){
    .mobile-call-fixed{display:flex;}
    body{padding-bottom:66px;}
  }
</style>
</head>

<main id="top">
